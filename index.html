 up jumping as high as possible. Land softly with knees slightly bent.",mistakes:["Landing with straight legs","Not hitting squat depth before jumping"],equipment:"None"},{name:"Wall Sit",sets:"3 x 45-60 sec",muscle:"Quads",form:"Back flat against wall, thighs parallel to floor, knees at 90\xB0. Hold position. Arms out in front.",mistakes:["Knees going past 90\xB0","Pushing through heels","Sliding back up early"],equipment:"Wall"},{name:"Calf Raise on Step",sets:"4 x 25",muscle:"Calves",form:"Stand on step edge. Full range \u2014 rise to toes, lower heel below step. Pause at both ends.",mistakes:["Bouncing through reps","Short range of motion"],equipment:"Step or stair"}]},4:{gym:[{name:"Overhead Press",sets:"4 x 8-10",muscle:"Shoulders (all heads)",form:"Stand with barbell at shoulder height, grip just outside shoulders. Press overhead until arms straight. Lower back to clavicle.",mistakes:["Flaring elbows too wide","Leaning back excessively","Bar path drifting forward"],equipment:"Barbell"},{name:"Dumbbell Lateral Raise",sets:"4 x 12-15",muscle:"Side Delts",form:"Hold dumbbells at sides. Raise to shoulder height with slight elbow bend. Pinky slightly higher than thumb (like pouring a jug). Lower slowly.",mistakes:["Using momentum/swinging","Raising too high above shoulder","Straight-arm raises (causes impingement)"],equipment:"Dumbbells"},{name:"Face Pull",sets:"3 x 15-20",muscle:"Rear Delts + Rotator Cuff",form:"Set cable at head height with rope. Pull to face, hands beside ears, elbows high. External rotate at end of movement.",mistakes:["Not keeping elbows high","Pulling to neck instead of face","Too heavy (ruin form)"],equipment:"Cable machine + rope"},{name:"Dumbbell Front Raise",sets:"3 x 12",muscle:"Front Delts",form:"Hold dumbbells at thighs. Raise one at a time to shoulder height. Lower with control.",mistakes:["Swinging body","Going above shoulder height","Locking elbows"],equipment:"Dumbbells"},{name:"Barbell Shrug",sets:"4 x 12-15",muscle:"Traps",form:"Hold barbell in front, arms straight. Shrug shoulders straight up toward ears. Pause at top, lower slowly.",mistakes:["Rolling shoulders (causes injury)","Not achieving full height","Bending elbows"],equipment:"Barbell"}],home:[{name:"Pike Push-Up",sets:"4 x 12-15",muscle:"Shoulders",form:"Start in downward dog, hips high. Lower head toward floor between hands. Push back up. Like a vertical press.",mistakes:["Hips too low (becomes regular push-up)","Head hitting floor"],equipment:"None"},{name:"Lateral Raise (water bottles)",sets:"4 x 15",muscle:"Side Delts",form:"Hold water bottles or any weight at sides. Raise to shoulder height with slight elbow bend. Lower slowly.",mistakes:["Swinging momentum","Going above shoulder level"],equipment:"Water bottles or any household weight"},{name:"Handstand Hold (wall)",sets:"3 x 20-30 sec",muscle:"Shoulders + Core",form:"Kick up to wall. Hold position with arms straight and core tight. Progress to handstand push-ups over time.",mistakes:["Arching back","Looking up instead of down at floor"],equipment:"Wall"},{name:"Rear Delt Fly (floor)",sets:"3 x 15",muscle:"Rear Delts",form:"Lie face down. Hold light weights, raise arms out to sides keeping slight elbow bend. Squeeze shoulder blades.",mistakes:["Too heavy (form breaks)","Arms going forward instead of to sides"],equipment:"Light dumbbells or water bottles"},{name:"Shoulder Tap Push-Up",sets:"3 x 10 each side",muscle:"Shoulders + Core",form:"In push-up position. Do a push-up, at top tap opposite shoulder with hand. Alternate. Keep hips stable.",mistakes:["Hips rotating side to side","Rushing the shoulder tap"],equipment:"None"}]},5:{gym:[{name:"Power Clean",sets:"4 x 5",muscle:"Full Body Power",form:"Bar at shins, explosively pull bar up by extending hips and knees, shrug and catch in quarter squat. This is a skill \u2014 start light.",mistakes:["Pulling with arms too early","Not extending hips fully","Catching too high"],equipment:"Barbell"},{name:"Pull-Up",sets:"4 x max",muscle:"Back + Biceps",form:"Overhand grip wider than shoulders. Hang fully, then pull chin above bar. Lower slowly all the way down.",mistakes:["Not going full range (partial reps)","Kipping/swinging","Shrugging at the bottom"],equipment:"Pull-up bar"},{name:"Dumbbell Curl to Press",sets:"3 x 10",muscle:"Biceps + Shoulders",form:"Curl dumbbells up, then rotate and press overhead. Two exercises combined. Control both movements.",mistakes:["Rushing the movement","Using momentum on the curl portion"],equipment:"Dumbbells"},{name:"Tricep Dips",sets:"3 x 12-15",muscle:"Triceps",form:"Upright torso, elbows back. Lower until upper arm parallel, press up. Keep chest up.",mistakes:["Leaning forward too much","Not going full depth"],equipment:"Dip bars"},{name:"Plank",sets:"3 x 60 sec",muscle:"Core",form:"Forearms on floor, body in straight line. Squeeze glutes and abs. Don't let hips sag or rise.",mistakes:["Hips dropping","Looking up (strains neck)","Holding breath"],equipment:"None"},{name:"Hanging Leg Raise",sets:"3 x 12-15",muscle:"Lower Abs",form:"Hang from bar. Raise legs to 90\xB0 keeping them straight. Lower with control. Don't swing.",mistakes:["Swinging momentum","Bending knees to make it easier","Not controlling the descent"],equipment:"Pull-up bar"}],home:[{name:"Burpee",sets:"4 x 15",muscle:"Full Body",form:"Drop to push-up, do push-up, jump feet to hands, explode up jumping with arms overhead. Land softly.",mistakes:["Skipping the push-up","Landing with straight legs","Poor push-up form"],equipment:"None"},{name:"Pull-Up or Doorframe Row",sets:"4 x max",muscle:"Back + Biceps",form:"If you have a bar, do full pull-ups. Otherwise doorframe row: hold frame, lean back, pull chest to door.",mistakes:["Not achieving full range","Kipping for pull-ups"],equipment:"Pull-up bar or doorframe"},{name:"Diamond Push-Up",sets:"3 x 12",muscle:"Triceps",form:"Hands together under chest. Lower chest to hands, press up. Elbows go back, not out.",mistakes:["Hands too far forward","Elbows flaring"],equipment:"None"},{name:"Plank to Push-Up",sets:"3 x 10",muscle:"Core + Chest",form:"Start in forearm plank. Press up to full push-up one arm at a time, then back down. Alternate lead arm.",mistakes:["Hips rocking","Rushing the movement"],equipment:"None"},{name:"Mountain Climbers",sets:"3 x 30 sec",muscle:"Core + Cardio",form:"Push-up position. Drive knees alternately to chest quickly. Keep hips level, don't bounce them up.",mistakes:["Hips rising too high","Too slow to get cardio benefit"],equipment:"None"}]},6:{gym:[],home:[{name:"Morning Walk or Jog",sets:"20-30 min",muscle:"Cardio + Recovery",form:"Easy pace, conversational. This is active recovery, not a workout. Just move.",mistakes:["Going too hard and sabotaging recovery"],equipment:"None"},{name:"Full Body Stretch",sets:"10-15 min",muscle:"Flexibility",form:"Hold each stretch 30-45 seconds. Focus on areas trained this week: hips, chest, back, shoulders.",mistakes:["Bouncing (use static holds)","Stretching cold muscles \u2014 warm up first"],equipment:"None"},{name:"Yoga Flow",sets:"15-20 min",muscle:"Mobility + Mind",form:"Follow any beginner YouTube yoga flow. Focus on breathing and holding positions.",mistakes:["Forcing range you don't have yet"],equipment:"Mat optional"}]}},Ee=[{text:"Arise.",author:"System"},{text:"The pain you feel today will be the strength you feel tomorrow.",author:"Unknown"},{text:"Discipline is choosing between what you want now and what you want most.",author:"Unknown"},{text:"You don't rise to the level of your goals. You fall to the level of your systems.",author:"James Clear"},{text:"Every morning you have two choices: continue to sleep with your dreams, or wake up and chase them.",author:"Unknown"},{text:"The strongest version of you is built in the moments you want to quit.",author:"Unknown"},{text:"Small daily improvements over time lead to stunning results.",author:"Robin Sharma"},{text:"Do not pray for an easy life. Pray for the strength to endure a difficult one.",author:"Bruce Lee"},{text:"You are the only person on earth who can use your ability.",author:"Zig Ziglar"},{text:"It never gets easier. You just get stronger.",author:"Unknown"},{text:"The man who moves a mountain begins by carrying small stones.",author:"Confucius"},{text:"Success is the sum of small efforts repeated day in and day out.",author:"Robert Collier"},{text:"Don't limit your challenges. Challenge your limits.",author:"Unknown"},{text:"I know what I have to do. I just have to do it.",author:"Sung Jin-Woo"},{text:"The body achieves what the mind believes.",author:"Unknown"},{text:"Wake up. Work hard. Sleep. Repeat.",author:"Unknown"},{text:"Your future self is watching you right now through your memories.",author:"Unknown"},{text:"Be so good they can't ignore you.",author:"Steve Martin"},{text:"The hard days are what make you stronger.",author:"Aly Raisman"},{text:"Do something today that your future self will thank you for.",author:"Sean Patrick Flanery"},{text:"Strength does not come from physical capacity. It comes from indomitable will.",author:"Gandhi"},{text:"You have to be willing to do the things today others won't, to have the things tomorrow others don't.",author:"Unknown"},{text:"The secret of getting ahead is getting started.",author:"Mark Twain"},{text:"Push yourself because no one else is going to do it for you.",author:"Unknown"},{text:"Great things never come from comfort zones.",author:"Unknown"},{text:"The difference between who you are and who you want to be is what you do.",author:"Unknown"},{text:"Earned, not given.",author:"Unknown"},{text:"One day or day one. You decide.",author:"Unknown"},{text:"The only bad workout is the one that didn't happen.",author:"Unknown"},{text:"Stop wishing. Start doing.",author:"Unknown"}];function wt(){let s=new Date().getDate()+new Date().getMonth()*31;return Ee[s%Ee.length]}var ke={postWorkout:[{name:"Chicken & Rice",emoji:"\u{1F357}",time:"30 min",tags:["bulk","maintain"],ingredients:["200g chicken breast","150g white rice","1 head broccoli","Salt, pepper, garlic powder","1 tbsp olive oil"],steps:["Cook rice in salted water for 18 mins, drain.","Season chicken with salt, pepper, garlic powder.","Heat olive oil in pan on medium-high. Cook chicken 6-7 mins each side until golden.","Steam broccoli for 5 mins or microwave with a splash of water for 3 mins.","Slice chicken, serve over rice with broccoli on the side."]},{name:"Egg Omelette",emoji:"\u{1F95A}",time:"10 min",tags:["cut","maintain"],ingredients:["4 eggs","Handful of spinach","30g cheese (any)","Salt and pepper","Butter or oil"],steps:["Crack eggs into bowl, whisk with salt and pepper.","Heat butter in pan on medium. Pour in eggs.","When edges start to set, add spinach and cheese on one half.","Fold the other half over. Cook 1 more min.","Slide onto plate and eat immediately."]},{name:"Protein Shake + Banana",emoji:"\u{1F964}",time:"2 min",tags:["bulk","cut","maintain"],ingredients:["1 scoop whey protein","250ml milk (or water for fewer calories)","1 banana"],steps:["Add milk to shaker or blender first.","Add protein powder.","Shake for 30 seconds or blend until smooth.","Eat the banana alongside it.","Drink within 30 minutes post-workout for best absorption."]},{name:"Tuna Rice Bowl",emoji:"\u{1F41F}",time:"10 min",tags:["cut","maintain"],ingredients:["1 can tuna in water","150g cooked rice","\xBD cucumber, diced","1 tbsp soy sauce","1 tsp sesame oil (optional)","Spring onion"],steps:["Cook rice in advance or use leftover rice.","Drain tuna and break apart with a fork.","Slice cucumber and spring onion.","Mix rice, tuna, and cucumber in a bowl.","Drizzle soy sauce and sesame oil over top. Mix and eat."]},{name:"Beef & Potato",emoji:"\u{1F969}",time:"40 min",tags:["bulk"],ingredients:["150g beef mince","2 medium potatoes","Handful of frozen peas","1 onion","Salt, pepper, garlic","1 tbsp oil"],steps:["Cube potatoes and boil in salted water for 15 mins until soft. Drain.","Dice onion. Fry in oil on medium heat for 3 mins.","Add beef mince, break apart. Cook until browned, about 8 mins.","Add garlic, salt, pepper. Stir in peas. Cook 2 more mins.","Serve mince over potatoes."]},{name:"Salmon & Veggies",emoji:"\u{1F41F}",time:"25 min",tags:["maintain","cut"],ingredients:["150g salmon fillet","Mixed vegetables (peppers, courgette, onion)","Lemon","Olive oil","Salt, pepper, garlic powder"],steps:["Preheat oven to 200\xB0C.","Chop vegetables, toss with olive oil, salt, pepper. Spread on baking tray.","Place salmon on tray. Season with salt, pepper, garlic powder, squeeze of lemon.","Roast everything for 18-20 mins until salmon flakes easily.","Serve with extra lemon squeezed over."]},{name:"Greek Yogurt Bowl",emoji:"\u{1F963}",time:"5 min",tags:["maintain","cut"],ingredients:["200g Greek yogurt (full fat or low fat)","Handful of berries","1 tsp honey","2 tbsp granola"],steps:["Spoon yogurt into a bowl.","Top with berries.","Drizzle honey over.","Add granola last so it stays crunchy.","Eat immediately."]},{name:"Cottage Cheese Toast",emoji:"\u{1F35E}",time:"5 min",tags:["maintain","cut"],ingredients:["2 slices wholegrain bread","150g cottage cheese","1 tomato","Salt, pepper","Optional: chilli flakes"],steps:["Toast the bread.","Spread cottage cheese generously on each slice.","Slice tomato and lay on top.","Season with salt, pepper, and chilli flakes if using.","Eat immediately."]},{name:"Scrambled Eggs & Toast",emoji:"\u{1F373}",time:"8 min",tags:["bulk","maintain"],ingredients:["4 eggs","Splash of milk","2 slices wholegrain toast","Butter","Salt, pepper","Optional: cheese"],steps:["Crack eggs into bowl, add milk, salt, pepper. Whisk well.","Heat pan on medium-low, add small knob of butter.","Pour in eggs. Let sit 20 seconds, then slowly fold with spatula.","Remove from heat while still slightly wet \u2014 residual heat finishes them.","Toast bread, serve eggs on top. Add cheese if bulking."]},{name:"Peanut Butter Banana Shake",emoji:"\u{1F95C}",time:"3 min",tags:["bulk"],ingredients:["1 scoop protein powder","1 banana","1 tbsp peanut butter","300ml whole milk","4 ice cubes"],steps:["Add all ingredients to blender.","Blend on high for 45 seconds until smooth.","Taste \u2014 add honey if you want sweeter.","Drink immediately post-workout."]},{name:"Turkey & Avocado Wrap",emoji:"\u{1F32F}",time:"7 min",tags:["maintain","cut"],ingredients:["1 wholegrain wrap","100g sliced turkey breast","\xBD avocado","Lettuce leaves","1 tsp mustard or hot sauce","Salt, pepper"],steps:["Lay wrap flat. Spread mustard across the centre.","Layer lettuce, then turkey slices.","Slice avocado and lay on top. Season with salt and pepper.","Fold sides in, roll tightly. Slice in half diagonally.","Eat immediately or wrap in foil to take with you."]},{name:"Overnight Oats",emoji:"\u{1F963}",time:"5 min prep",tags:["bulk","maintain"],ingredients:["80g rolled oats","250ml milk","1 tbsp chia seeds","1 tbsp honey","Berries or banana to top"],steps:["Add oats, milk, chia seeds, and honey to a jar or container.","Stir well so everything is combined.","Seal and refrigerate overnight (or minimum 4 hours).","In the morning, top with fruit and eat cold.","Optional: add protein powder to boost protein content."]}],byGoal:{bulk:[{name:"Mass Oats",emoji:"\u{1F963}",time:"5 min",ingredients:["100g oats","2 scoops protein powder","1 tbsp peanut butter","1 banana","300ml whole milk"],steps:["Add oats and milk to bowl. Microwave 2-3 mins, stirring halfway.","Stir in protein powder while hot.","Top with sliced banana and peanut butter.","Optional: add a drizzle of honey. Eat while warm."]},{name:"Pasta Bolognese",emoji:"\u{1F35D}",time:"30 min",ingredients:["200g pasta","200g beef mince","1 can chopped tomatoes","1 onion","2 garlic cloves","Salt, pepper, Italian herbs","Parmesan to serve"],steps:["Boil pasta in salted water per packet instructions.","Dice onion and garlic. Fry in oil for 3 mins.","Add beef mince, cook until browned, about 8 mins. Drain excess fat.","Add chopped tomatoes, herbs, salt, pepper. Simmer 10 mins.","Drain pasta, mix with sauce. Top with parmesan."]},{name:"Full Breakfast",emoji:"\u{1F373}",time:"20 min",ingredients:["4 eggs","3 rashers bacon","1 can baked beans","2 slices toast","1 tomato","Butter"],steps:["Fry bacon in dry pan on medium-high, 3-4 mins each side.","In same pan, fry eggs in bacon fat sunny side up, 3 mins.","Heat beans in small saucepan, stirring occasionally.","Halve tomato, fry cut-side down for 3 mins.","Toast bread, butter it. Serve everything together."]},{name:"Tuna Pasta Bake",emoji:"\u{1F35D}",time:"35 min",ingredients:["200g pasta","2 cans tuna","1 can cream of mushroom soup","100g grated cheese","Salt, pepper","Optional: peas"],steps:["Cook pasta in salted boiling water per packet. Drain, save a cup of pasta water.","Mix drained tuna, soup, and peas in a baking dish.","Add pasta, stir everything together. Add splash of pasta water if too thick.","Top with grated cheese.","Bake at 190\xB0C for 20 mins until golden and bubbling."]},{name:"Rice & Mince Bowl",emoji:"\u{1F35A}",time:"25 min",ingredients:["150g beef or chicken mince","150g rice","1 onion","2 garlic cloves","Soy sauce","Sesame oil","Spring onion"],steps:["Cook rice in salted water 18 mins. Drain.","Dice onion and garlic. Fry in oil 3 mins.","Add mince, break apart. Cook until browned, 8 mins.","Add 2 tbsp soy sauce and 1 tsp sesame oil. Stir.","Serve mince over rice. Top with sliced spring onion."]},{name:"Peanut Butter Oats",emoji:"\u{1F95C}",time:"5 min",ingredients:["100g oats","300ml whole milk","2 tbsp peanut butter","1 banana","1 tsp honey","Pinch of salt"],steps:["Combine oats, milk, and salt in saucepan.","Cook on medium heat stirring for 4-5 mins until thick.","Stir in peanut butter off the heat.","Pour into bowl, top with sliced banana and honey.","Eat immediately while warm."]}],cut:[{name:"Chicken Salad",emoji:"\u{1F957}",time:"15 min",ingredients:["150g chicken breast","Mixed salad greens","\xBD cucumber","1 tomato","1 tbsp olive oil","1 tsp lemon juice","Salt, pepper"],steps:["Season chicken with salt and pepper. Pan-fry in a tiny bit of oil, 6 mins each side.","While chicken cooks, chop cucumber and tomato.","Mix olive oil and lemon juice for dressing.","Slice chicken. Combine all vegetables in bowl.","Top with chicken, drizzle dressing over."]},{name:"Veggie Stir Fry",emoji:"\u{1F966}",time:"20 min",ingredients:["Mixed vegetables (broccoli, peppers, carrot, snap peas)","2 eggs or 100g tofu","1 tbsp soy sauce","1 tsp sesame oil","Garlic, ginger","50g rice (optional, small portion)"],steps:["If using rice, cook it first.","Heat pan or wok on high. Add tiny bit of oil.","Add garlic and ginger, stir 30 seconds.","Add hard vegetables first (carrot, broccoli), stir fry 3 mins.","Add soft veg (peppers, peas), cook 2 mins more.","Push veg aside, scramble eggs or add tofu. Mix everything.","Add soy sauce and sesame oil. Toss and serve."]},{name:"Protein Smoothie",emoji:"\u{1F964}",time:"5 min",ingredients:["1 scoop protein powder","Handful of spinach","150g frozen berries","200ml water or almond milk","Optional: \xBD banana"],steps:["Add liquid to blender first.","Add spinach, berries, and protein powder.","Blend on high for 30-45 seconds until smooth.","Taste \u2014 add banana if you want it sweeter.","Drink immediately."]},{name:"Tuna Salad Lettuce Wraps",emoji:"\u{1F957}",time:"10 min",ingredients:["2 cans tuna in water","Large lettuce leaves (iceberg or romaine)","\xBD cucumber","1 celery stalk","1 tbsp light mayo or Greek yogurt","Lemon juice","Salt, pepper"],steps:["Drain tuna. Flake into bowl.","Dice cucumber and celery finely. Add to tuna.","Mix in mayo or yogurt, squeeze of lemon, salt and pepper.","Spoon mixture into lettuce leaves \u2014 use as cups.","Eat immediately. Under 300 calories total."]},{name:"Egg White Omelette",emoji:"\u{1F95A}",time:"8 min",ingredients:["5 egg whites (or carton)","Handful spinach","\xBD red pepper, diced","30g feta cheese","Salt, pepper","Cooking spray"],steps:["Whisk egg whites with salt and pepper.","Spray pan with cooking spray, heat on medium.","Add peppers, cook 2 mins. Add spinach, wilt 1 min.","Pour egg whites over vegetables. Cook until edges set.","Crumble feta on top, fold in half. Serve immediately."]},{name:"Greek Chicken Bowl",emoji:"\u{1F357}",time:"20 min",ingredients:["150g chicken breast","\xBD cucumber","Cherry tomatoes","Red onion","50g feta cheese","Kalamata olives","Olive oil, lemon, oregano"],steps:["Season chicken with oregano, salt, pepper. Cook in pan 6 mins each side.","Chop cucumber, halve tomatoes, slice red onion thinly.","Combine vegetables in bowl.","Slice chicken and add on top.","Drizzle olive oil and lemon over everything. Crumble feta on top."]}],maintain:[{name:"Rice Bowl",emoji:"\u{1F35A}",time:"20 min",ingredients:["150g rice","Any protein (chicken, tuna, egg, tofu)","Roasted or steamed vegetables","Sauce of choice (soy, hot sauce, yogurt)"],steps:["Cook rice in salted water, 18 mins. Drain.","Cook your chosen protein simply \u2014 pan fry or boil.","Steam or microwave vegetables 3-4 mins.","Assemble in bowl: rice base, protein on top, veg on side.","Add sauce and any seasoning you like."]},{name:"Wholegrain Wrap",emoji:"\u{1F32F}",time:"10 min",ingredients:["1 wholegrain wrap","100g cooked chicken or tuna","\xBD avocado","Salad leaves","1 tbsp hummus or yogurt sauce","Salt, pepper"],steps:["Lay wrap flat. Spread hummus or sauce across the centre.","Layer salad leaves down the middle.","Add chicken or tuna, sliced avocado.","Season with salt and pepper.","Fold the sides in, roll tightly from bottom. Cut in half diagonally."]},{name:"Lentil Soup",emoji:"\u{1F372}",time:"30 min",ingredients:["200g red lentils","1 onion","2 garlic cloves","1 can chopped tomatoes","1 tsp cumin","1 tsp paprika","Salt, pepper","Olive oil","Optional: lemon juice"],steps:["Dice onion and garlic. Fry in olive oil on medium for 4 mins.","Add cumin and paprika, stir 1 min until fragrant.","Add lentils, chopped tomatoes, and 600ml water.","Bring to boil, reduce heat. Simmer 20 mins stirring occasionally until thick.","Season with salt, pepper, squeeze of lemon. Serve with bread."]},{name:"Stir Fry Noodles",emoji:"\u{1F35C}",time:"20 min",ingredients:["150g egg noodles","150g chicken or tofu","Mixed veg (broccoli, carrot, pepper)","2 tbsp soy sauce","1 tbsp oyster sauce","Garlic, ginger","Sesame oil"],steps:["Cook noodles per packet. Drain and set aside.","Stir fry garlic and ginger in hot oiled pan 30 seconds.","Add protein, cook until done (5-7 mins for chicken).","Add vegetables, stir fry 3-4 mins on high heat.","Add noodles, soy sauce, oyster sauce. Toss everything together.","Drizzle sesame oil. Serve immediately."]},{name:"Baked Potato & Filling",emoji:"\u{1F954}",time:"60 min",ingredients:["2 medium potatoes","1 can tuna or 100g cheese","2 tbsp Greek yogurt or sour cream","Spring onion","Salt, pepper"],steps:["Pierce potatoes all over with fork. Rub with oil and salt.","Microwave 10-12 mins (turning halfway) OR bake 200\xB0C for 50 mins.","Test with knife \u2014 should go in easily.","Slice open, fluff inside with fork.","Top with tuna or cheese, dollop of yogurt, spring onion."]},{name:"Vegetable Omelette",emoji:"\u{1F373}",time:"12 min",ingredients:["3 eggs","\xBD onion","\xBD pepper","Handful mushrooms","Salt, pepper","Oil or butter","Optional: cheese"],steps:["Dice onion, pepper, and mushrooms.","Fry vegetables in oil on medium 5 mins until soft.","Whisk eggs with salt and pepper. Pour over vegetables.","Cook on medium-low without stirring until edges set, about 3 mins.","Add cheese if using, fold in half. Slide onto plate."]},{name:"Chicken Fried Rice",emoji:"\u{1F35A}",time:"20 min",ingredients:["200g leftover cooked rice (cold)","150g chicken breast or leftovers","2 eggs","Frozen peas and corn","Soy sauce","Garlic","Spring onion","Sesame oil"],steps:["Dice chicken, cook in oiled pan until done. Set aside.","In same pan on high heat
